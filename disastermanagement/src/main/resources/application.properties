spring.datasource.url=${DB_URL:jdbc:h2:mem:disaster_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

app.iot.online-timeout-seconds=60
app.iot.offline-timeout-seconds=180

# Phase 2 tracking credentials: can be supplied out-of-band or via environment variables.
# Format: memberId=token;memberId2=token2
app.tracking.responder-tokens=${TRACKING_RESPONDER_TOKENS:1=responder-token-1;2=responder-token-2}
# Format: deviceId=token;deviceId2=token2
app.tracking.vehicle-tokens=${TRACKING_VEHICLE_TOKENS:VEH-01=vehicle-token-1}
# Format: deviceId=teamId;deviceId2=teamId2
app.tracking.vehicle-team-ids=${TRACKING_VEHICLE_TEAM_IDS:VEH-01=1}
# Optional format: deviceId=vehicle name;deviceId2=vehicle name 2
app.tracking.vehicle-identifiers=${TRACKING_VEHICLE_IDENTIFIERS:VEH-01=Rescue Engine 1}
app.tracking.online-timeout-seconds=${TRACKING_ONLINE_TIMEOUT_SECONDS:60}
app.tracking.stale-timeout-seconds=${TRACKING_STALE_TIMEOUT_SECONDS:180}
app.tracking.minimum-update-seconds=${TRACKING_MINIMUM_UPDATE_SECONDS:5}

# Automatic responder dispatch. Offers are created after an incident is VERIFIED.
app.dispatch.offer-timeout-seconds=${DISPATCH_OFFER_TIMEOUT_SECONDS:120}
app.dispatch.offer-batch-size=${DISPATCH_OFFER_BATCH_SIZE:2}
app.seeder.seed-members=${SEED_DEFAULT_MEMBERS:true}

# Nominatim is accessed through this backend proxy so the server can identify the
# application, cache repeated searches, and pace requests to the public service.
app.geocoding.endpoint=${GEOCODING_ENDPOINT:https://nominatim.openstreetmap.org/search}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:SmartDisasterManagement/1.0 (local development)}
app.geocoding.email=${GEOCODING_EMAIL:}
app.geocoding.minimum-request-interval-ms=${GEOCODING_MINIMUM_REQUEST_INTERVAL_MS:1100}
app.geocoding.cache-ttl-seconds=${GEOCODING_CACHE_TTL_SECONDS:86400}
