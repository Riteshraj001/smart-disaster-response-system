spring.datasource.url=jdbc:h2:mem:disaster_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.iot.online-timeout-seconds=60
app.iot.offline-timeout-seconds=180
app.tracking.responder-tokens=1=test-responder-token
app.tracking.vehicle-tokens=vehicle-test=test-vehicle-token
app.tracking.vehicle-team-ids=vehicle-test=1
app.tracking.vehicle-identifiers=vehicle-test=Test Response Vehicle
app.tracking.online-timeout-seconds=60
app.tracking.stale-timeout-seconds=180
app.tracking.minimum-update-seconds=0
app.dispatch.offer-timeout-seconds=60
app.dispatch.offer-batch-size=1
app.seeder.seed-members=false
